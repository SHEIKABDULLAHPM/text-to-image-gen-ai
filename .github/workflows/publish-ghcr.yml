name: Publish Docker Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image namespace
        id: prep
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/text-to-image-gen-ai-backend:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/text-to-image-gen-ai-backend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push model-service
        uses: docker/build-push-action@v6
        with:
          context: ./model-service
          file: ./model-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/text-to-image-gen-ai-model-service:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/text-to-image-gen-ai-model-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/text-to-image-gen-ai-frontend:latest
            ghcr.io/${{ steps.prep.outputs.owner_lc }}/text-to-image-gen-ai-frontend:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
