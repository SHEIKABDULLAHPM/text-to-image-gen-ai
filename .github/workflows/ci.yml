name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: text-to-image-gen-ai/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build model-service image
        uses: docker/build-push-action@v6
        with:
          context: ./model-service
          file: ./model-service/Dockerfile
          push: false
          tags: text-to-image-gen-ai/model-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_BASE_URL=/api
          tags: text-to-image-gen-ai/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
